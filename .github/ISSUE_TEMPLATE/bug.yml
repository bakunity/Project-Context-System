name: Bug
description: Report a reproducible product or tooling defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, commands, or fixture needed to reproduce.
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: Commit / version
      placeholder: exact SHA, tag, or UNKNOWN
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, test output, screenshots, links, or other evidence. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Components that may be changed and anything that must be preserved.
